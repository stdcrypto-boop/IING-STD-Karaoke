name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify preinstalled Android SDK
        run: |
          test -n "$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms"
          echo "SDK: $ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile and run JVM unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: IING-STD-Karaoke-test-reports
          if-no-files-found: ignore
          path: |
            app/build/reports/tests/
            app/build/test-results/
      - name: Configure persistent APK signing (if secrets are set)
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.IING_SIGNING_KEYSTORE_B64 }}
          IING_SIGNING_STORE_PASSWORD: ${{ secrets.IING_SIGNING_STORE_PASSWORD }}
          IING_SIGNING_KEY_ALIAS: ${{ secrets.IING_SIGNING_KEY_ALIAS }}
          IING_SIGNING_KEY_PASSWORD: ${{ secrets.IING_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$SIGNING_KEYSTORE_B64" ] && [ -n "$IING_SIGNING_STORE_PASSWORD" ] && [ -n "$IING_SIGNING_KEY_ALIAS" ] && [ -n "$IING_SIGNING_KEY_PASSWORD" ]; then
            printf '%s' "$SIGNING_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/iing-karaoke-signing.jks"
            echo "IING_SIGNING_KEYSTORE=$RUNNER_TEMP/iing-karaoke-signing.jks" >> "$GITHUB_ENV"
            echo "IING_SIGNING_STORE_PASSWORD=$IING_SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "IING_SIGNING_KEY_ALIAS=$IING_SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "IING_SIGNING_KEY_PASSWORD=$IING_SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNING_MODE=persistent" >> "$GITHUB_ENV"
            echo "Persistent signing configured."
          else
            echo "SIGNING_MODE=ephemeral-debug" >> "$GITHUB_ENV"
            echo "::warning::Signing secrets absent: this debug APK may conflict with previous builds. Do not distribute as an updatable APK."
          fi
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify APK package and checksum
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" | tail -n 2
          sha256sum "$APK" | tee app/build/outputs/apk/debug/SHA256SUMS.txt
          ls -lh "$APK"
          echo "Signing mode: $SIGNING_MODE"
      - uses: actions/upload-artifact@v4
        with:
          name: IING-STD-Karaoke-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt

      - name: Stage draft APK only with persistent signing
        if: ${{ success() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${SIGNING_MODE:-}" != "persistent" ]; then
            echo "::notice::No persistent signing configured. Debug artifact only; skipping direct APK release to prevent broken updates."
            exit 0
          fi
          APK="app/build/outputs/apk/debug/app-debug.apk"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          cp "$APK" IING-STD-Karaoke.apk
          sha256sum IING-STD-Karaoke.apk > IING-STD-Karaoke.apk.sha256
          gh release create "karaoke-build-${GITHUB_RUN_NUMBER}" IING-STD-Karaoke.apk IING-STD-Karaoke.apk.sha256 \
            --title "IING STD Karaoke candidate build ${GITHUB_RUN_NUMBER}" \
            --notes "UNVERIFIED CANDIDATE: Android device/Bonkyo F999 NEO audio validation and in-place update testing are still required. Do not publish as final. Persistent signing configured; commit ${GITHUB_SHA}." \
            --target "$GITHUB_SHA" --draft --prerelease
